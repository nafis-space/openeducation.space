<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>OpenEducation.space</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #261f2c;
        --a: #e8b7c5;
        --b: #c8bddf;
        --leaf: #b5c7aa;
        --fg: #f7f0e9;
        --muted: #d5cbd2;
        --card: rgba(255, 255, 255, 0.055);
        --bd: rgba(247, 240, 233, 0.16);
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --r: 28px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 19px/1.55 "Cormorant Garamond", Georgia, serif;
        min-height: 100vh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: clamp(16px, 4vw, 40px);
        display: grid;
        gap: 20px;
        justify-items: center;
      }
      .top {
        width: 100%;
        display: grid;
        justify-items: center;
        text-align: center;
      }
      .brand {
        color: var(--fg);
        font-size: clamp(2.5rem, 7vw, 4.5rem);
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 1.08;
        overflow-wrap: anywhere;
      }
      .brand span {
        color: var(--a);
      }
      .mail {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 20px;
        display: grid;
        gap: 14px;
        min-width: min(240px, 100%);
        width: min(100%, 360px);
        justify-self: center;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .mail span {
        opacity: 0.7;
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .btn {
        display: inline-block;
        text-align: center;
        background: var(--fg);
        color: var(--bg);
        padding: 11px 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 500;
        transition:
          transform 0.5s var(--ease),
          opacity 0.3s;
      }
      .btn:hover {
        transform: scale(1.04);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .hero {
        position: relative;
        isolation: isolate;
        width: 100%;
        border-radius: var(--r);
        overflow: hidden;
        min-height: 300px;
        padding: clamp(44px, 8vw, 88px) clamp(24px, 10vw, 120px);
        display: grid;
        place-items: center;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--bd);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        user-select: none;
        -webkit-user-select: none;
      }
      .hero::before,
      .hero::after {
        position: absolute;
        z-index: -1;
        color: var(--a);
        font-family: Georgia, serif;
        line-height: 1;
        opacity: 0.34;
        pointer-events: none;
        animation: bloom 1.2s var(--ease) both;
      }
      .hero::before {
        content: "✿";
        top: 12%;
        left: 7%;
        font-size: clamp(3.5rem, 9vw, 7rem);
        transform: rotate(-14deg);
      }
      .hero::after {
        content: "✾";
        right: 8%;
        bottom: 8%;
        color: var(--b);
        font-size: clamp(3rem, 7vw, 5.5rem);
        animation-delay: 180ms;
        transform: rotate(12deg);
      }
      .hero-copy {
        max-width: 760px;
        color: var(--fg);
        font-size: clamp(1.9rem, 4vw, 3rem);
        font-weight: 500;
        line-height: 1.25;
        text-wrap: balance;
        user-select: none;
        -webkit-user-select: none;
      }
      .hero-label {
        display: block;
        margin-bottom: 16px;
        color: var(--leaf);
        font: italic 600 1.2rem/1.3 "Cormorant Garamond", Georgia, serif;
        letter-spacing: 0.08em;
      }
      .word {
        display: inline-block;
        opacity: 0;
        animation: word-arrive 700ms var(--ease) forwards;
        animation-delay: calc(var(--word-index) * 70ms + 250ms);
      }
      @keyframes word-arrive {
        from {
          opacity: 0;
          transform: translateY(0.45em);
          filter: blur(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
      @keyframes bloom {
        from {
          opacity: 0;
          scale: 0.55;
        }
        to {
          opacity: 0.34;
          scale: 1;
        }
      }
      .card {
        width: 100%;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 8px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .row {
        display: grid;
        grid-template-columns: 1.4fr 0.8fr 0.6fr 1.6fr;
        gap: 12px;
        align-items: center;
        padding: 16px 18px;
        border-radius: 20px;
        transition: background 0.4s var(--ease);
        text-align: center;
      }
      .row > * {
        justify-self: center;
      }
      .row:not(.head):hover {
        background: color-mix(in srgb, var(--fg) 8%, transparent);
      }
      .head {
        color: var(--muted);
        font: 500 0.95rem/1.4 "Cormorant Garamond", Georgia, serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.6;
      }
      .row a {
        color: inherit;
        text-decoration: none;
        font-weight: 500;
        overflow-wrap: anywhere;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 8px;
        background: #999;
        transition: background 0.4s;
      }
      .on .dot {
        background: var(--leaf);
        box-shadow: 0 0 0 4px rgba(181, 199, 170, 0.16);
      }
      .off .dot {
        background: var(--a);
      }
      .chk .dot {
        animation: p 1.2s infinite;
      }
      @keyframes p {
        50% {
          opacity: 0.3;
        }
      }
      .reveal {
        opacity: 0;
        transform: translateY(14px);
        animation: in 0.9s var(--ease) forwards;
      }
      @keyframes in {
        to {
          opacity: 1;
          transform: none;
        }
      }
      footer {
        color: var(--muted);
        font-size: 1.95rem;
        text-align: center;
        padding: 8px;
      }
      @media (max-width: 720px) {
        .top {
          grid-template-columns: 1fr;
        }
        .row {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .head {
          display: none;
        }
        .row .ms {
          display: none;
        }
        .row .det {
          grid-column: auto;
          color: var(--muted);
          font-size: 0.95rem;
        }
        .hero {
          min-height: 260px;
          padding-inline: 24px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
        .reveal {
          opacity: 1;
          transform: none;
        }
        .word,
        .hero::before,
        .hero::after {
          animation: none !important;
          opacity: 1;
          filter: none;
          scale: 1;
          transform: none;
        }
      }
    </style></head><body><main>
      <section class="top reveal">
        <h1 class="brand">OpenEducation<span>.space</span></h1>
      </section>
      <section class="hero reveal" style="animation-delay:.1s">
        <p class="hero-copy"><span class="hero-label">Our purpose</span><span class="word" style="--word-index: 0">A</span> <span class="word" style="--word-index: 1">home</span> <span class="word" style="--word-index: 2">for</span> <span class="word" style="--word-index: 3">a</span> <span class="word" style="--word-index: 4">future</span> <span class="word" style="--word-index: 5">where</span> <span class="word" style="--word-index: 6">free,</span> <span class="word" style="--word-index: 7">accessible</span> <span class="word" style="--word-index: 8">education</span> <span class="word" style="--word-index: 9">can</span> <span class="word" style="--word-index: 10">bloom</span> <span class="word" style="--word-index: 11">and</span> <span class="word" style="--word-index: 12">grow</span> <span class="word" style="--word-index: 13">within</span> <span class="word" style="--word-index: 14">everyone’s</span> <span class="word" style="--word-index: 15">reach.</span></p>
      </section>
      <section class="card reveal" style="animation-delay:.2s"><div id="rows"></div></section>
      <section class="mail reveal"><span>Say hello</span><a class="btn" id="mail" href="#">Contact</a></section>
      <footer id="foot">You may request a third level domain for free if you are a student or educator.</footer>
    </main>
    <script>
      const CONFIG = {
        domain: "openeducation.space",
        email: "hello@nafis.bd",
        subs: [
          { host: "sat.openeducation.space", detail: "SAT practice hub" },
          { host: "ils.openeducation.space", detail: "Interactive learning space" },
          { host: "lab.openeducation.space", detail: "Personal lab" },
        ],
      };
      const $ = (s) => document.querySelector(s);
      $("#mail").href = "mailto:" + CONFIG.email;
      $("#rows").innerHTML =
        '<div class="row head"><div>Subdomain</div><div>Status</div><div>Ping</div><div>Details</div></div>' +
        CONFIG.subs
          .map(
            (s, i) =>
              `<div class="row chk" id="r${i}"><a href="https://${s.host}">${s.host}</a><div><span class="dot"></span><b class="st">Checking</b></div><div class="ms">–</div><div class="det">${s.detail}</div></div>`,
          )
          .join("");
      CONFIG.subs.forEach(async (s, i) => {
        const r = $("#r" + i),
          c = new AbortController(),
          t0 = performance.now(),
          to = setTimeout(() => c.abort(), 6000);
        let ok = false;
        try {
          await fetch("https://" + s.host, {
            mode: "no-cors",
            cache: "no-store",
            signal: c.signal,
          });
          ok = true;
        } catch (e) {}
        clearTimeout(to);
        r.classList.remove("chk");
        r.classList.add(ok ? "on" : "off");
        r.querySelector(".st").textContent = ok ? "Online" : "Offline";
        if (ok)
          r.querySelector(".ms").textContent =
            Math.round(performance.now() - t0) + " ms";
      });
    </script></body></html>
